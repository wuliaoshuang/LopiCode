<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录页 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lc-page n-root">
    <p class="lc-text n-t1">欢迎 &lt;b&gt;'回来'&lt;/b&gt; $5</p>
    <div class="lc-card n-card">
      <input class="lc-input n-in" placeholder="手机号">
      <div class="lc-row n-row">
        <button type="button" class="lc-button n-b1">登录</button>
        <button type="button" class="lc-button n-b2">注册</button>
        <input class="lc-input n-in2" placeholder="行内输入">
        <p class="lc-text n-tx">行内文本</p>
        <hr class="lc-divider n-dv">
        <div class="lc-spacer n-sp"></div>
      </div>
    </div>
    <div class="lc-image n-img" role="img" aria-label="图片占位"></div>
    <img class="lc-image n-img2" src="https://example.com/a.png" alt="">
    <ul class="lc-list n-ls">
      <li>一</li>
      <li>二 &amp; 三</li>
    </ul>
    <div class="lc-column n-col">
      <div class="lc-container n-c1">
      </div>
    </div>
    <hr class="lc-divider n-dv2">
    <div class="lc-spacer n-sp2"></div>
  </main>
</body>
</html>
